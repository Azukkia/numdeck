<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
  <title>NumDeck Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      padding: 6px;
    }

    .panel {
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      background: rgba(11, 13, 19, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      overflow: hidden;
      transition: opacity 0.25s ease;
    }
    body.locked .panel { opacity: 0.82; }

    /* ---- entête (zone de déplacement) ---- */
    .head {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      -webkit-app-region: drag;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      flex-shrink: 0;
    }
    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #4b5263;
      flex-shrink: 0;
      transition: all 0.25s ease;
    }
    body.deck-on .dot { background: #34d399; box-shadow: 0 0 8px #34d399; }
    .preset-name {
      flex: 1;
      font-size: 11px;
      font-weight: 700;
      color: #cdd3e3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .head-btn {
      width: 20px; height: 20px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #8a90a6;
      cursor: pointer;
      display: grid;
      place-items: center;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }
    .head-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .head-btn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
    body.locked .head-btn { display: none; }

    /* ---- mini deck ---- */
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      padding: 8px;
    }
    .mk {
      --c: #22d3ee;
      position: relative;
      border-radius: 8px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      min-height: 0;
    }
    .mk.bound { border-color: color-mix(in srgb, var(--c) 55%, rgba(255, 255, 255, 0.1)); }
    .mk img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .mk .g {
      position: absolute;
      top: 1px; left: 3px;
      font-size: 7px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      text-shadow: 0 1px 2px #000;
      z-index: 2;
    }
    .mk .dsp {
      position: absolute; inset: 0;
      display: grid;
      place-items: center;
      font-size: 9px;
      font-weight: 800;
      color: #e8eaf2;
      text-shadow: 0 1px 3px #000;
      z-index: 2;
      text-align: center;
    }
    .mk.deco { opacity: 0.35; }
    .mk.power .dsp { font-size: 10px; color: #6b7280; }
    body.deck-on .mk.power {
      border-color: rgba(52, 211, 153, 0.7);
      box-shadow: 0 0 9px rgba(52, 211, 153, 0.4);
    }
    body.deck-on .mk.power .dsp { color: #34d399; }

    @keyframes mk-flash {
      0% { box-shadow: 0 0 0 1px var(--c), 0 0 14px var(--c); }
      100% { box-shadow: none; }
    }
    .mk.flash { animation: mk-flash 0.45s ease-out; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <span class="dot" id="dot"></span>
      <span class="preset-name" id="preset-name">NumDeck</span>
      <button class="head-btn" id="btn-lock" title="Verrouiller (les clics traverseront — déverrouillage via l'icône NumDeck de la zone de notification)">
        <svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.6"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
      </button>
      <button class="head-btn" id="btn-hide" title="Masquer l'overlay (réactivable depuis NumDeck)">
        <svg viewBox="0 0 16 16"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>
      </button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <script src="mock.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
