<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
      display: grid;
      place-items: center;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 22px;
      border-radius: 18px;
      background: rgba(13, 16, 24, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      opacity: 0;
      transform: translateY(14px) scale(0.96);
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.3);
      max-width: 340px;
    }
    .pill.show { opacity: 1; transform: translateY(0) scale(1); }
    .icon {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    .kind-on .icon { background: rgba(52, 211, 153, 0.18); color: #34d399; box-shadow: 0 0 14px rgba(52, 211, 153, 0.35); }
    .kind-off .icon { background: rgba(148, 163, 184, 0.12); color: #94a3b8; }
    .kind-preset .icon { background: rgba(124, 92, 255, 0.2); color: #a78bfa; box-shadow: 0 0 14px rgba(124, 92, 255, 0.35); }
    .kind-key .icon { background: rgba(34, 211, 238, 0.15); color: #22d3ee; }
    .kind-error .icon { background: rgba(248, 113, 113, 0.15); color: #f87171; }
    .texts { min-width: 0; }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subtitle {
      font-size: 11.5px;
      color: #8a90a6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subtitle:empty { display: none; }
  </style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="icon" id="icon"></div>
    <div class="texts">
      <div class="title" id="title"></div>
      <div class="subtitle" id="subtitle"></div>
    </div>
  </div>
  <script src="osd.js"></script>
</body>
</html>
